name: finpilot

x-backend-env: &backend-env
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finpilot}
  DB_USER: ${POSTGRES_USER:-finpilot}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  DB_READONLY_USER: ${DB_READONLY_USER:-finpilot_readonly}
  DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:?set DB_READONLY_PASSWORD in .env}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P14D}
  FINPILOT_ENCRYPTION_KEY: ${FINPILOT_ENCRYPTION_KEY:?set FINPILOT_ENCRYPTION_KEY in .env}
  ML_BASE_URL: http://ml:8000
  ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?set ML_SERVICE_TOKEN in .env}
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:20800}
  RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5}
  RATE_LIMIT_API: ${RATE_LIMIT_API:-300}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
  RETRAIN_MIN_CORRECTIONS: ${RETRAIN_MIN_CORRECTIONS:-5}
  RETRAIN_CRON: ${RETRAIN_CRON:-0 */15 * * * *}
  LOG_FORMAT: ${LOG_FORMAT:-ecs}

services:
  postgres:
    image: postgres:16-alpine
    container_name: finpilot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finpilot}
      POSTGRES_USER: ${POSTGRES_USER:-finpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["20810:5432"]
    volumes: [finpilot-pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: finpilot-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["20811:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ml:
    build: ./ml
    image: finpilot-ml:latest
    container_name: finpilot-ml
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?set ML_SERVICE_TOKEN in .env}
      ML_MODEL_DIR: /app/models
    ports: ["20802:8000"]
    volumes: [finpilot-models:/app/models]
    restart: unless-stopped

  backend:
    build: ./backend
    image: finpilot-backend:latest
    container_name: finpilot-backend
    environment: *backend-env
    ports: ["20801:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      ml: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: finpilot-frontend:latest
    container_name: finpilot-frontend
    ports: ["20800:8080"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

volumes:
  finpilot-pgdata:
  finpilot-models:

networks:
  default:
    name: finpilot-net
