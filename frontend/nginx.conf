# FinPilot frontend: static SPA + reverse proxy to the Spring Boot backend.
# Runs as the unprivileged "nginx" user and listens on 8080.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # Imports may be up to 5 MB.
  client_max_body_size 6m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json application/problem+json application/javascript
             application/xml application/xml+rss image/svg+xml font/woff2;

  # Docker's embedded DNS; resolving at request time lets nginx start before the backend.
  resolver 127.0.0.11 valid=30s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $backend http://backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass $backend;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /actuator/ {
      proxy_pass $backend;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Swagger UI uses inline scripts, so it is served without the SPA's strict CSP.
    location /swagger-ui {
      proxy_pass $backend;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }

    location /v3/api-docs {
      proxy_pass $backend;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Content-hashed build output: cache forever.
    location /assets/ {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location = /index.html {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    # SPA history fallback.
    location / {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
